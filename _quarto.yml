project:
  type: book
  execute-dir: project

book:
  title: "Violencia basada en género"
  author:
    - name: "José Ordoñez"
      affiliation: "Universidad Nacional de Loja"
    - name: "Camila Gutiérrez"
      affiliation: "Universidad Nacional de Loja"
    - name: "Marisol Vega"
      affiliation: "Universidad Nacional de Loja"
  date: "2026"

  chapters:
    - index.qmd
    - capitulos/Introduccion.qmd
    - "capitulos/Datos y variables.qmd"
    - "capitulos/Diagnóstico sectorial.qmd"
    - "capitulos/Diagnóstico territorial.qmd"
    - "capitulos/Problemas y potencialidades.qmd"
    - "capitulos/Evidencia empírica.qmd"
    - "capitulos/Revisión de la Literatura.qmd"
    - capitulos/Referencias.qmd 

bibliography: "capitulos/Referencias.bib"
csl: apa.csl
lang: es

execute:
  echo: false
  warning: false
  message: false

format:
  html:
    toc: true
    number-sections: true

  pdf:
    documentclass: scrreprt
    toc: true
    toc-title: "Tabla de contenidos"
    toc-depth: 3
    number-sections: true
    colorlinks: true
    keep-tex: true
    geometry:
      - margin=2.5cm
    fontsize: 11pt
    
